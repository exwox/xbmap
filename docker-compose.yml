services:
  liquidmap:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      XBMAP_DEMO: ${XBMAP_DEMO:-0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8787}
      # Durable, dependency-free projection used by the gateway. Production
      # PostgreSQL/ClickHouse/object-storage services are available through the
      # opt-in `storage` profile below.
      XBMAP_HISTORY_DIR: ${XBMAP_HISTORY_DIR:-/var/lib/liquidmap/history}
      XBMAP_HISTORY_QUEUE_RECORDS: ${XBMAP_HISTORY_QUEUE_RECORDS:-20000}
      XBMAP_HISTORY_BATCH_RECORDS: ${XBMAP_HISTORY_BATCH_RECORDS:-1000}
      XBMAP_HISTORY_FLUSH_MS: ${XBMAP_HISTORY_FLUSH_MS:-250}
      XBMAP_HISTORY_SEGMENT_BYTES: ${XBMAP_HISTORY_SEGMENT_BYTES:-16777216}
      XBMAP_HISTORY_BACKUP_DIR: ${XBMAP_HISTORY_BACKUP_DIR:-/var/lib/liquidmap/backups}
      XBMAP_HISTORY_BACKUP_INTERVAL_MS: ${XBMAP_HISTORY_BACKUP_INTERVAL_MS:-86400000}
      XBMAP_HISTORY_BACKUP_KEEP: ${XBMAP_HISTORY_BACKUP_KEEP:-7}
      XBMAP_CAPTURE_DIR: ${XBMAP_CAPTURE_DIR:-}
    ports:
      - "8787:8787"
    volumes:
      - liquidmap_history:/var/lib/liquidmap/history
      - liquidmap_backups:/var/lib/liquidmap/backups
      - liquidmap_captures:/var/lib/liquidmap/captures
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["storage"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liquidmap}
      POSTGRES_USER: ${POSTGRES_USER:-liquidmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-migrate:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["storage"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-liquidmap}
      POSTGRES_USER: ${POSTGRES_USER:-liquidmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - ./migrations/postgres:/migrations:ro
      - ./scripts/storage/run-postgres-migrations.sh:/runner/run.sh:ro
    entrypoint: ["/bin/sh", "/runner/run.sh"]
    restart: "no"

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.3-alpine}
    profiles: ["storage"]
    environment:
      # Migration v1 is intentionally namespaced to this fixed database.
      CLICKHOUSE_DB: liquidmap
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquidmap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-before-production}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse-migrate:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.3-alpine}
    profiles: ["storage"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: liquidmap
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-liquidmap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-before-production}
    volumes:
      - ./migrations/clickhouse:/migrations:ro
      - ./scripts/storage/run-clickhouse-migrations.sh:/runner/run.sh:ro
    entrypoint: ["/bin/sh", "/runner/run.sh"]
    restart: "no"

  object-storage:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-liquidmap}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-before-production}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  liquidmap_history:
  liquidmap_backups:
  liquidmap_captures:
  postgres_data:
  clickhouse_data:
  object_storage_data:
